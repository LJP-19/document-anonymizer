name: Build and release

# Builds run on native GitHub-hosted runners because the .exe and .dmg cannot be
# produced from a Linux development machine (spec section 57).
#
# Push to the branch  -> builds, uploads artifacts.
# Push a v* tag       -> builds, uploads artifacts, publishes a GitHub Release.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.12"
  # Pinned model wheel. Installed from a URL, never downloaded by the app itself.
  SPACY_MODEL_WHEEL: "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl"

jobs:
  test:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          install() {
            for attempt in 1 2 3; do
              pip install --no-cache-dir --retries 5 --timeout 60 "$@" && return 0
              echo "::warning::pip attempt $attempt failed for: $*"
              pip cache purge || true
              sleep $((attempt * 10))
            done
            return 1
          }
          install -r requirements-dev.txt
          install "${SPACY_MODEL_WHEEL}"
          python buildtools/fetch_models.py
      - name: Install the optional LLM runtime
        # Never fatal. A corrupt or missing wheel disables the audit pass; the
        # rules, GLiNER, layout and propagation layers are unaffected.
        continue-on-error: true
        run: |
          for version in 0.3.35 0.3.30 0.3.16; do
            if pip install --no-cache-dir --retries 3 --timeout 60 "llama-cpp-python==$version" --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu; then
              if python -c "import llama_cpp"; then exit 0; fi
            fi
            echo "::warning::llama-cpp-python $version unusable, trying the next"
            pip uninstall -y llama-cpp-python || true
            pip cache purge || true
          done
          echo "::warning::no usable llama-cpp-python wheel; this build ships without the LLM audit pass"
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0
      - name: Run the full suite
        # GUI tests are back in the gate: the teardown crash was a test leaving
        # a worker running, not a Qt defect. 10 consecutive clean runs.
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests -q
      - name: End-to-end CLI run on synthetic fixtures
        run: |
          python -m tests.fixtures build/fixtures
          python -m app.cli process build/fixtures/form.pdf --accept-all -o build/form.anon.pdf
          python -m app.cli process build/fixtures/stacked.pdf --accept-all -o build/stacked.anon.pdf

  windows:
    name: Windows .exe
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          function Install-Retry {
            param([string[]]$PipArgs)
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              pip install --no-cache-dir --retries 5 --timeout 60 @PipArgs
              if ($LASTEXITCODE -eq 0) { return }
              Write-Warning "pip attempt $attempt failed: $PipArgs"
              pip cache purge
              Start-Sleep -Seconds ($attempt * 10)
            }
            throw "pip failed after 3 attempts: $PipArgs"
          }
          Install-Retry @("-r", "requirements-dev.txt")
          Install-Retry @("pyinstaller==6.11.1")
          Install-Retry @("${env:SPACY_MODEL_WHEEL}")
          python buildtools/fetch_models.py
      - name: Install the optional LLM runtime
        # Never fatal. A corrupt or missing wheel disables the audit pass only.
        continue-on-error: true
        run: |
          foreach ($version in @("0.3.35", "0.3.30", "0.3.16")) {
            pip install --no-cache-dir --retries 3 --timeout 60 "llama-cpp-python==$version" --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
            if ($LASTEXITCODE -eq 0) {
              python -c "import llama_cpp"
              if ($LASTEXITCODE -eq 0) { exit 0 }
            }
            Write-Warning "llama-cpp-python $version unusable, trying the next"
            pip uninstall -y llama-cpp-python
            pip cache purge
          }
          Write-Warning "no usable llama-cpp-python wheel; this build ships without the LLM audit pass"
      - name: Confirm the model is installed before packaging
        run: python -c "import spacy; spacy.load('en_core_web_sm'); print('model OK')"
      - name: Run the regression suite on this runner
        # The Linux job gates the build, but PyMuPDF text extraction, font
        # metrics and path handling differ per platform - and this is the exact
        # machine that produces the installer.
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests -q
      - name: End-to-end CLI run on this runner
        run: |
          python -m tests.fixtures build/fixtures
          python -m app.cli process build/fixtures/form.pdf --accept-all -o build/form.anon.pdf
          python -m app.cli process build/fixtures/stacked.pdf --accept-all -o build/stacked.anon.pdf
      - name: Build
        run: python buildtools/build.py
      - name: Read version
        id: v
        shell: bash
        run: echo "version=$(python -c 'import app.version;print(app.version.__version__)')" >> $GITHUB_OUTPUT
      - name: Name the artifact
        shell: bash
        run: |
          mkdir -p out
          cp -r dist/DocumentAnonymizer "out/DocumentAnonymizer-Windows-v${{ steps.v.outputs.version }}"
          cd out && 7z a "DocumentAnonymizer-Windows-v${{ steps.v.outputs.version }}.zip" "DocumentAnonymizer-Windows-v${{ steps.v.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: DocumentAnonymizer-Windows-v${{ steps.v.outputs.version }}
          path: out/*.zip
          if-no-files-found: error
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: out/*.zip
          generate_release_notes: true

  macos:
    name: macOS .dmg
    needs: test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          install() {
            for attempt in 1 2 3; do
              pip install --no-cache-dir --retries 5 --timeout 60 "$@" && return 0
              echo "::warning::pip attempt $attempt failed for: $*"
              pip cache purge || true
              sleep $((attempt * 10))
            done
            return 1
          }
          install -r requirements-dev.txt
          install pyinstaller==6.11.1
          install "$SPACY_MODEL_WHEEL"
          python buildtools/fetch_models.py
      - name: Install the optional LLM runtime
        # Never fatal. A corrupt or missing wheel disables the audit pass; the
        # rules, GLiNER, layout and propagation layers are unaffected.
        continue-on-error: true
        run: |
          for version in 0.3.35 0.3.30 0.3.16; do
            if pip install --no-cache-dir --retries 3 --timeout 60 "llama-cpp-python==$version" --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu; then
              if python -c "import llama_cpp"; then exit 0; fi
            fi
            echo "::warning::llama-cpp-python $version unusable, trying the next"
            pip uninstall -y llama-cpp-python || true
            pip cache purge || true
          done
          echo "::warning::no usable llama-cpp-python wheel; this build ships without the LLM audit pass"
      - name: Confirm the model is installed before packaging
        run: python -c "import spacy; spacy.load('en_core_web_sm'); print('model OK')"
      - name: Run the regression suite on this runner
        # The Linux job gates the build, but PyMuPDF text extraction, font
        # metrics and path handling differ per platform - and this is the exact
        # machine that produces the installer.
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests -q
      - name: End-to-end CLI run on this runner
        run: |
          python -m tests.fixtures build/fixtures
          python -m app.cli process build/fixtures/form.pdf --accept-all -o build/form.anon.pdf
          python -m app.cli process build/fixtures/stacked.pdf --accept-all -o build/stacked.anon.pdf
      - name: Build .app and .dmg
        run: python buildtools/build.py --dmg
      - name: Read version
        id: v
        run: echo "version=$(python -c 'import app.version;print(app.version.__version__)')" >> $GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        with:
          name: DocumentAnonymizer-macOS-v${{ steps.v.outputs.version }}
          path: dist/*.dmg
          if-no-files-found: error
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: dist/*.dmg
          generate_release_notes: true
